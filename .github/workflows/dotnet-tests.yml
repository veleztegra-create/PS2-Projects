name: .NET tests

on:
  pull_request:
    paths:
      - "src/**/*.cs"
      - "src/**/*.csproj"
      - "tests/**/*.cs"
      - "tests/**/*.csproj"
      - ".github/workflows/dotnet-tests.yml"
  push:
    branches:
      - main
      - "agent/**"
      - "fix/**"
    paths:
      - "src/**/*.cs"
      - "src/**/*.csproj"
      - "tests/**/*.cs"
      - "tests/**/*.csproj"
      - ".github/workflows/dotnet-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run tests
        run: dotnet test tests/PS2Manager.Core.Tests/PS2Manager.Core.Tests.csproj --configuration Release --verbosity minimal
